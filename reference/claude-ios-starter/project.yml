name: Serasona
options:
  bundleIdPrefix: com.serasona
  deploymentTarget:
    iOS: "17.0"
targets:
  Serasona:
    type: application
    platform: iOS
    sources: [Serasona/Sources/Serasona]
    info:
      path: Serasona/Sources/Serasona/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Serasona listens to your voice check-in to read your signals."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serasona.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
