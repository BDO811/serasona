name: Serasona
options:
  bundleIdPrefix: com.serasona
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: "JC874B66JG" # the only signing team on this machine; replace if Serasona enrolled under another
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  Serasona:
    type: application
    platform: iOS
    sources:
      - path: Serasona
      - path: Shared
    info:
      path: Generated/Serasona-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Serasona
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Serasona listens to a short voice check-in to read your energy, stress and mood."
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Bricolage-400.ttf
          - Bricolage-650.ttf
          - Bricolage-700.ttf
          - Hanken-400.ttf
          - Hanken-500.ttf
          - Hanken-650.ttf
          - Hanken-700.ttf
          - DMMono-400.ttf
          - DMMono-500.ttf
    entitlements:
      path: Generated/Serasona.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serasona.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serasona.app
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SerasonaWatch
        embed: true
      - target: SerasonaWidget
        embed: true
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore

  SerasonaWatch:
    type: application
    platform: watchOS
    sources:
      - path: SerasonaWatch
      - path: Shared
      - path: Serasona/Resources/GoogleService-Info.plist
        buildPhase: resources
    info:
      path: Generated/SerasonaWatch-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Serasona
        WKApplication: true
        WKSupportsRunningWithoutiOSApp: true
        WKCompanionAppBundleIdentifier: com.serasona.app
        NSMicrophoneUsageDescription: "Serasona listens to a short voice check-in to read your energy, stress and mood."
        UIAppFonts:
          - Bricolage-400.ttf
          - Bricolage-650.ttf
          - Bricolage-700.ttf
          - Hanken-400.ttf
          - Hanken-500.ttf
          - Hanken-650.ttf
          - Hanken-700.ttf
          - DMMono-400.ttf
          - DMMono-500.ttf
    entitlements:
      path: Generated/SerasonaWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serasona.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serasona.app.watchkitapp
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: SerasonaComplication
        embed: true

  SerasonaComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: SerasonaComplication
      - path: Shared
    info:
      path: Generated/SerasonaComplication-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Serasona
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/SerasonaComplication.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serasona.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serasona.app.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  SerasonaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SerasonaWidget
      - path: Shared
    info:
      path: Generated/SerasonaWidget-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Serasona
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Bricolage-400.ttf
          - Bricolage-650.ttf
          - Bricolage-700.ttf
          - Hanken-400.ttf
          - Hanken-500.ttf
          - Hanken-650.ttf
          - Hanken-700.ttf
          - DMMono-400.ttf
          - DMMono-500.ttf
    entitlements:
      path: Generated/SerasonaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serasona.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serasona.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO

schemes:
  Serasona:
    build:
      targets:
        Serasona: all
    run:
      config: Debug
  SerasonaWatch:
    build:
      targets:
        SerasonaWatch: all
    run:
      config: Debug
