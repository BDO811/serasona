name: Serasona
options:
  bundleIdPrefix: com.amplifierhealth
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

packages:
  SerasonaKit:
    path: Packages/SerasonaKit

targets:
  Serasona:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Serasona/Sources
      - path: Shared/Sources
        group: Shared
    dependencies:
      - package: SerasonaKit
      - target: SerasonaWatch
        embed: true
    info:
      path: Serasona/Info.plist
      properties:
        CFBundleDisplayName: Serasona
        NSMicrophoneUsageDescription: "Serasona reads your voice during a check-in to measure vocal biomarkers."
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amplifierhealth.serasona
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets: []
      commandLineArguments: {}

  SerasonaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: SerasonaWatch/Sources
      - path: Shared/Sources
        group: Shared
    dependencies:
      - package: SerasonaKit
    info:
      path: SerasonaWatch/Info.plist
      properties:
        CFBundleDisplayName: Serasona
        NSMicrophoneUsageDescription: "Serasona reads your voice during a check-in to measure vocal biomarkers."
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.amplifierhealth.serasona
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amplifierhealth.serasona.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        SDKROOT: watchos
        SKIP_INSTALL: false

schemes:
  Serasona:
    build:
      targets:
        Serasona: all
        SerasonaWatch: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
