name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tsc -p tsconfig.app.json --noEmit

      - run: npx vitest run

      # Served from the domain root at tryserasona.com. public/CNAME
      # carries the custom domain into dist so each deploy keeps it.
      # Firebase web config. Public client config, not secrets — Firebase
      # identifies the project with these and enforces access with Security
      # Rules and authorized domains, both of which are set on the project.
      # They live here rather than in .env because .env is gitignored, and
      # without them the built site ships with auth silently disabled.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCKySJYqydO97YOJyllmvSC6rH3maIrUCg
          VITE_FIREBASE_AUTH_DOMAIN: amits-playground-po.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: amits-playground-po
          VITE_FIREBASE_STORAGE_BUCKET: amits-playground-po.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "551580534721"
          VITE_FIREBASE_APP_ID: 1:551580534721:web:ab936c018e263dd9201140
          # Billing endpoints. Public URLs; each function verifies the
          # Firebase ID token itself. Without these the built site reports
          # "Plans aren't open yet" no matter how healthy Stripe is.
          VITE_CREATE_CHECKOUT_SESSION_URL: https://us-central1-amits-playground-po.cloudfunctions.net/createCheckoutSession
          VITE_CREATE_PORTAL_SESSION_URL: https://us-central1-amits-playground-po.cloudfunctions.net/createPortalSession
          VITE_ADMIN_API_URL: https://us-central1-amits-playground-po.cloudfunctions.net/adminApi
          # Without this, /voice reports "isn't open yet" and the phone
          # check-in silently falls back to the default voice.
          VITE_CLONE_VOICE_URL: https://us-central1-amits-playground-po.cloudfunctions.net/cloneVoice

      # Inspects the artifact rather than the environment that produced it.
      # The build itself refuses to run without Firebase configured, but a
      # variable can also be present and empty, or a bundle can be produced
      # by a mode that skips that guard. Serasona records voice, and the
      # account is where Terms acceptance and recording consent are captured,
      # so a build that cannot authenticate must never reach the CDN.
      - name: Verify the consent gate survived the build
        run: node scripts/verify-build.mjs
        env:
          VITE_FIREBASE_AUTH_DOMAIN: amits-playground-po.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: amits-playground-po

      # The app uses BrowserRouter, so /detailed-analysis and friends are
      # client-side routes with no file behind them. GitHub Pages serves
      # 404.html for unknown paths; making it a copy of index.html lets the
      # router handle those URLs instead of showing Pages' own 404.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
