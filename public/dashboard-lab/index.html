function studio(){return `${bar()}<div class="studio"><section class="studio-left"><span class="tag">Voice check-in</span><h1 class="record-title">Say a little.<br>Learn a little more.</h1><p>Tell us about your morning, a recent meal or the plans you are looking forward to.</p>${wave()}${action()}<p class="note">At least 20 seconds of natural speech.<br>This prototype offers a simulated check-in or local microphone preview.</p><div class="step"><span>01</span><div><h3>Find a quiet place</h3><p>Keep a comfortable distance from your microphone.</p></div></div><div class="step"><span>02</span><div><h3>Speak naturally</h3><p>No special words. No performance required.</p></div></div><div class="step"><span>03</span><div><h3>Review in context</h3><p>Check quality, compare history and add your own perspective.</p></div></div></section><section class="studio-right"><div class="row"><h2>Your last check-in</h2><small>OCT 18 · 8:42 AM</small></div><div class="score"><div class="big">81<small> /100</small></div><div><h3>Clear</h3><small>Example Serasona index</small></div></div>${metrics()}<section class="panel"><h2>What your voice can add</h2><p>A view of returned wellness signals, compared across your own check-ins. It complements how you feel.</p>${signalList()}</section><button onclick="openFeatures()">Explore the model library ↗</button></section></div>`}
function lab(){let days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return `${bar()}<div class="workbench"><section class="workbench-main"><div class="title"><h1>Your patterns, made visible.</h1><p>Follow a signal across sessions. Keep the quality of each sample in view.</p></div><div class="row"><select aria-label="Select pattern" style="width:auto" onchange="signal=this.value;render()">${['Stress','Wellness','Clarity'].map(n=>`<option ${signal===n?'selected':''}>${n}</option>`).join('')}</select>${ranges()}</div>${chart()}<p class="note">Product index, not a clinical measurement · Personal reference zone illustrated</p><div class="heatmap"><div class="head">SIGNAL INDEX</div>${days.map(d=>`<div class="head">${d}</div>`).join('')}${Object.entries(series).map(([n,a])=>`<div class="head">${n}</div>${a.map(v=>`<div class="${v>78?'dark':''}">${v}</div>`).join('')}`).join('')}</div><div class="row"><h2>Session evidence</h2><select aria-label="Session filter" style="width:auto" onchange="view=this.value;render()">${['All sessions','Browser only','Phone only','Quality issues'].map(n=>`<option ${view===n?'selected':''}>${n}</option>`).join('')}</select></div><table><thead><tr><th>SESSION</th><th>SOURCE</th><th>AUDIO</th><th>STATUS</th><th>REVIEW</th></tr></thead><tbody>${[['Oct 18','Browser','24s','Usable'],['Oct 17','Phone','26s','Lower fidelity'],['Oct 16','Browser','8s','Insufficient audio']].filter(r=>view==='All sessions'||view==='Browser only'&&r[1]==='Browser'||view==='Phone only'&&r[1]==='Phone'||view==='Quality issues'&&r[3]!=='Usable').map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><button onclick="openSession('${r[3]}')">Open ↗</button></td></tr>`).join('')}</tbody></table></section><aside class="workbench-aside"><span class="tag">Personal exploration</span><section class="panel" style="margin-top:25px"><h2>Ask a better question.</h2><p>Does this change persist across several good recordings?</p><button onclick="openNote()">Record a question</button></section><section class="panel"><h2>Keep sources separate.</h2><p>Voice indices come from the app’s returned signs. Sleep, HRV and heart rate require another data source.</p><button onclick="openSources()">Inspect data sources ↗</button></section>${captureCard()}</aside></div>`}
function research(){return `<article class="shell research"><h1>What to borrow.<br>What to improve.</h1><p>Research checked October 18, 2026. This gallery uses synthetic observations. It does not perform health analysis, contact a phone number or connect to your account.</p><h2>Wearable patterns worth borrowing</h2><table><thead><tr><th>PRODUCT</th><th>WHAT IT SURFACES</th><th>SERASONA OPPORTUNITY</th></tr></thead><tbody><tr><td><a href="https://www.whoop.com/us/en/thelocker/the-all-new-whoop-home-screen/" target="_blank" rel="noopener">WHOOP ↗</a></td><td>Sleep, recovery and strain dials; daily activity; customizable metric tiles and trends.</td><td>Three recognizable groups with clear drilldowns. Make voice capture as easy to find as results.</td></tr><tr><td><a href="https://ouraring.com/blog/new-oura-app-experience/" target="_blank" rel="noopener">Oura ↗</a></td><td>Today, Vitals and My Health; daily highlights, contributors, baseline context and longer trends.</td><td>Separate today’s meaning from detailed observations and longer history.</td></tr><tr><td><a href="https://humehealth.com/en-gb/pages/hume-app" target="_blank" rel="noopener">Hume ↗</a></td><td>Body composition, weight trends, HRV, sleep and recovery, depending on the connected device.</td><td>Combine related observations in one readable view, with the source and availability stated explicitly.</td></tr></tbody></table><h2>A stronger Serasona loop</h2><p>Capture → check audio quality → explain returned signs → compare compatible sessions → add personal context → return for the next check-in. Good dashboard design supports the entire loop.</p><h2>Five different product bets</h2><ol>${concepts.map((c,i)=>`<li><button onclick="switchVersion(${i+1})">${c[0]} ↗</button> ${c[2]}</li>`).join('')}</ol><h2>Grounded in your repository</h2><p><a href="https://github.com/BDO811/serasona" target="_blank" rel="noopener">BDO811/serasona ↗</a> is a React, TypeScript and Vite app. The existing dashboard and score module define Stress, Wellness and Clarity; the phone client already models dialing, ringing, in-call, analyzing and quality failures.</p><ul><li><code>src/pages/Dashboard.tsx</code>: replace the presentation while retaining authentication, entitlement and history hooks.</li><li><code>src/lib/serasona-score.ts</code>: retain band-based grouping and exclude inconclusive results. The weights are provisional product judgments, not validated outcome weights.</li><li><code>src/pages/Checkin.tsx</code> and <code>CheckinByPhone.tsx</code>: connect the chosen capture flow to the existing implementation.</li><li><code>src/lib/voice-checkin-client.ts</code>: preserve real call statuses and quality errors. Do not add SMS capture as though it is active.</li><li>Phone capture is gated to Plus and Executive in the existing dashboard. Browser capture offers higher fidelity. A real rollout should verify model support for each recording source.</li></ul><h2>Prototype boundaries</h2><p>All scores, reference zones, dates and observations here are illustrative. No mock score is calculated from microphone audio. Local recording preview stays in memory and is released when you close the dialog. Personal notes stay in this browser if storage is available. No wearable integration or clinical validation is implied.</p><h2>Suggested first iteration</h2><p>Use Daily briefing as the foundation, borrow the acquisition flow from Voice studio and the history from Health journal. Add Pattern lab as progressive detail once users have enough usable sessions.</p></article>`}
function showDialog(id,html){returnFocus=document.activeElement;let d=$(id);d.innerHTML=`<button class="close" aria-label="Close dialog" onclick="closeDialog('${id}')">Close</button>`+html;d.showModal()}
function closeDialog(id){$(id).close();if(id==='#capture')cleanup();returnFocus?.focus()}
function openSignal(group,name){let incon=name==='Airway pattern',overall=group==='Overall';showDialog('#detail',`<span class="tag">Illustrative result · voice derived</span><h2>${name||group}</h2>${incon?`<div class="status">Inconclusive · Excluded from the index</div><p>This example did not return a usable airway result. It is neither normal nor elevated. A new recording may help; the real service should supply the reason.</p><button onclick="closeDialog('#detail');openCapture('voice')">Make another recording</button>`:`<div class="big" style="font-size:56px">${overall?'81':{Stress:78,Wellness:82,Clarity:86}[group]}<small> /100</small></div><p>${overall?'The current app groups returned signs into Stress, Wellness and Clarity. The composite uses ordinal bands and provisional product weights.':'This group summarizes the signs returned by active models. Higher index values correspond to fewer flagged signs. It is not a direct physiological measurement.'}</p>${chart(group==='Clarity'?'Clarity':group==='Wellness'?'Wellness':'Stress')}<p class="note">Synthetic observations · Never average model raw scores across signs. Missing and inconclusive signs do not contribute. Comparisons should use compatible model coverage.</p>`}`)}
function featuresMarkup(){return `<div class="list">${[['Pulse','Everyday wellness','Mood, anxiety, stress, fatigue, hydration and blood pressure patterns.'],['Haven','Mental and behavioural health','Mental and behavioural signs.'],['Apex','Performance and strain','Cardiovascular strain, cognitive load and related signs.'],['Tide','Cardiometabolic','Longer term cardiometabolic patterns.'],['Aria','Women’s health','Physiology-specific patterns; opt in before enabling.'],['Breath','Respiratory','Airway and allergy patterns.'],['Clarity','Cognitive','Cognitive impairment pattern; directional evidence is limited.'],['Harbor','Recovery','Sensitive recovery signals require explicit consent.']].map(([n,t,b])=>`<button onclick="modelDetail('${n}')"><span>${n}<small>${t}</small></span><b>Explore ↗</b></button>`).join('')}</div><p class="note">Catalogue descriptions come from the existing app. Availability depends on your plan and consent. No model is activated by this prototype.</p>`}
function openFeatures(){showDialog('#detail',`<h2>One voice. Different perspectives.</h2><p>Explore the current model catalogue.</p>${featuresMarkup()}`)}
function modelDetail(n){let desc={Pulse:'Baseline wellness patterns across stress, mood, anxiety, fatigue, hydration and blood pressure.',Haven:'Mental and behavioural patterns including hypervigilance and attention dysregulation.',Apex:'Performance patterns including cardiovascular strain, cognitive load and head impact.',Tide:'Cardiometabolic patterns including metabolic load, iron deficiency and hydration.',Aria:'Women’s health patterns including elevated androgens and iron deficiency. Opt-in is required.',Breath:'Respiratory patterns including airway obstruction pattern and allergy.',Clarity:'Cognitive impairment pattern across repeated sessions. The app marks the published evidence as limited.',Harbor:'Sensitive recovery patterns including substance and alcohol use patterns. Separate consent is required.'};$('#detail').innerHTML=`<button class="close" onclick="closeDialog('#detail')">Close</button><h2>${n}</h2><p>${desc[n]}</p><p class="note">Existing product catalogue, not independent validation. No activation or purchase occurs in this demo.</p><button onclick="$('#detail').close();openFeatures()">Back to models</button>`}
function openSources(){showDialog('#detail','<h2>Know where a result comes from.</h2><div class="list"><p>Browser audio: example session, 24 seconds.</p><p>Phone audio: supported in the existing app; lower fidelity.</p><p>Wearable data: not connected. No HRV, sleep or heart rate data is available here.</p><p>Reflections: self reported. Kept separate from analyzed observations.</p></div>')}
function openJournal(d){showDialog('#detail',`<span class="tag">Illustrative history</span><h2>October ${12+d} · Morning reading</h2><p>Stress index: ${series.Stress[d]}<br>Wellness index: ${series.Wellness[d]}<br>Clarity index: ${series.Clarity[d]}</p><p class="note">Synthetic session. These indices summarize returned signs, not measured vital signs.</p>`)}
function openSession(status){showDialog('#detail',`<h2>${status}</h2><p>${status==='Insufficient audio'?'Eight seconds is below the example minimum of twenty seconds. No score should be displayed for this attempt.':status==='Lower fidelity'?'Telephone audio has different bandwidth from browser capture. Show provenance and confirm model compatibility before comparing results.':'This example contains twenty-four seconds of browser audio. A production dashboard should display the service’s returned quality assessment.'}</p><button onclick="closeDialog('#detail');openCapture('voice')">Record in browser</button>`)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getNote(){try{return localStorage.getItem('serasona.lab.note')||''}catch{return ''}}
function openNote(){showDialog('#detail',`<h2>Add your perspective.</h2><p>What was different about today? Notes are self reported and do not change the example score.</p><label for="reflection">Your reflection</label><textarea id="reflection">${escapeHTML(getNote())}</textarea><div class="actions"><button class="primary" onclick="saveNote()">Save reflection</button></div><p class="note" id="noteStatus">Saved only in this browser.</p>`)}function saveNote(){try{localStorage.setItem('serasona.lab.note',$('#reflection').value);closeDialog('#detail');render()}catch{$('#noteStatus').textContent='Browser storage is unavailable. Copy your note before closing.'}}
function cleanup(){clearInterval(timer);timer=null;if(recorder&&recorder.state!=='inactive')recorder.stop();stream?.getTracks().forEach(t=>t.stop());stream=null;if(recordURL)URL.revokeObjectURL(recordURL);recordURL=null}
function openCapture(mode){showDialog('#capture',`<span class="tag">Prototype capture</span><h2>A moment for your voice.</h2><div class="capture-tabs"><button class="${mode==='voice'?'active':''}" onclick="captureMode('voice')">Browser voice</button><button class="${mode==='phone'?'active':''}" onclick="captureMode('phone')">Phone call</button></div><div id="captureBody"></div>`);captureMode(mode)}
function captureMode(mode){cleanup();document.querySelectorAll('.capture-tabs button').forEach((b,i)=>b.classList.toggle('active',i===(mode==='voice'?0:1)));$('#captureBody').innerHTML=mode==='voice'?`<p>Speak naturally about your day for at least 20 seconds.</p>${wave()}<div class="status" role="status" id="captureStatus">Choose a simulated check-in or try the microphone locally. No audio is sent to a server.</div><div class="actions"><button class="primary" id="simulate" onclick="simulateCapture('voice')">Simulate a check-in</button><button id="mic" onclick="recordLocal()">Try local microphone</button></div><div id="playback"></div><p class="note">Microphone preview requires browser permission and a secure page or localhost. It does not generate results.</p>`:`<p>Receive a call, speak naturally, then return to review the session. Phone capture is a Plus and Executive feature in the current app.</p><div class="step"><span>01</span><div>Confirm number and recording consent</div></div><div class="step"><span>02</span><div>Answer the call and speak for 20 seconds</div></div><div class="step"><span>03</span><div>Review quality and available results</div></div><div class="status" role="status" id="captureStatus">Simulation only. No phone number is collected and no call will be placed.</div><div class="actions"><button class="primary" id="simulate" onclick="simulateCapture('phone')">Simulate phone flow</button></div><p class="note">In production: require confirmed number and consent, honor entitlement, show failures, and identify lower fidelity audio.</p>`}
function simulateCapture(mode){let states=mode==='phone'?['Dialing · demo','Ringing · demo','On the call · demo','Analyzing example session','Complete · illustrative results']:['Preparing microphone · demo','Listening · example audio','Checking recording quality','Analyzing example session','Complete · illustrative results'];let i=0;$('#simulate').disabled=true;let mic=$('#mic');if(mic)mic.disabled=true;$('#captureStatus').textContent=states[0];timer=setInterval(()=>{i++;if(!$('#capture').open){cleanup();return}$('#captureStatus').textContent=states[i];if(i===states.length-1){clearInterval(timer);$('#captureBody').innerHTML=`<div class="status">Demo complete · ${mode==='phone'?'Phone audio, lower fidelity':'Browser audio'}</div><h2>Ready to review.</h2><p>This flow used synthetic data. No voice was analyzed and no call was placed.</p><div class="actions"><button class="primary" onclick="closeDialog('#capture');openSignal('Overall')">View example results</button><button onclick="captureMode('${mode}')">Try again</button></div>`}},900)}
async function recordLocal(){let btn=$('#mic'),sim=$('#simulate');if(recorder?.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('#captureStatus').textContent='Microphone recording is unavailable in this browser. Use the simulation instead.';return}try{btn.disabled=true;stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!$('#capture').open){cleanup();return}let chunks=[],start=Date.now();recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());if(!$('#capture').open)return;recordURL=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));$('#playback').innerHTML=`<label>Local recording preview</label><audio controls style="width:100%" src="${recordURL}"></audio>`;$('#captureStatus').textContent='Recording stopped. Preview only; no upload and no health analysis.';btn.textContent='Record again';btn.disabled=false;sim.disabled=false};recorder.start();btn.disabled=false;btn.textContent='Stop recording';sim.disabled=true;timer=setInterval(()=>{$('#captureStatus').textContent=`Recording locally · ${Math.floor((Date.now()-start)/1000)} seconds · Aim for 20 seconds`;if(Date.now()-start>60000)recorder.stop()},250)}catch(e){cleanup();btn.disabled=false;$('#captureStatus').textContent='Microphone access was unavailable. Check browser permission or use the simulation.'}}

let motionOn=!matchMedia('(prefers-reduced-motion: reduce)').matches, visualRAF=0,visualObserver=null;
function hero(v){let names=['Your voice has a rhythm.','See the whole picture.','Every day leaves a trace.','Find your natural frequency.','Small shifts. A bigger picture.'];let copy=['A clearer view of your day, shaped by your voice and grounded in your own history.','Three connected perspectives. One recording. Explore what your voice brings into focus.','Connect the way you feel with the patterns that emerge over time.','A quiet space to speak, reflect and capture a better quality sample.','Look beyond one reading. Discover the patterns that hold across your history.'];return `<section class="visual-hero v${v}"><div class="hero-copy"><div class="hero-meta"><span class="live-dot"></span>YOUR VOICE, VISUALIZED · DEMO</div><h2>${names[v-1]}</h2>${v===4?'':`<p>${copy[v-1]}</p><div class="hero-bottom"><div><strong>${v===3?'7':'81'}</strong><small>${v===3?'DAYS IN VIEW':'EXAMPLE INDEX'}</small></div><div><strong>${v===3?'24':'24s'}</strong><small>${v===3?'SECOND CHECK-IN':'LAST RECORDING'}</small></div><div><strong>3</strong><small>CONNECTED VIEWS</small></div></div>`}</div><canvas class="sculpture" aria-label="Animated abstract voice sculpture. Decorative, not a plot of your audio." role="img"></canvas><div class="hero-legend"><span>Stress</span><span>Wellness</span><span>Clarity</span></div></section>`}
function toggleMotion(){motionOn=!motionOn;document.body.classList.toggle('motion-paused',!motionOn);document.querySelectorAll('.motion-toggle').forEach(b=>{b.textContent=motionOn?'Pause motion':'Play motion';b.setAttribute('aria-pressed',String(!motionOn))});if(motionOn)startSculpture()}
function enhanceVisuals(){cancelAnimationFrame(visualRAF);visualObserver?.disconnect();if(version<6){let target=version===4?document.querySelector('.studio-left'):version===5?document.querySelector('.workbench-main'):document.querySelector('.content');if(target){if(version===4)target.querySelector('.wave')?.replaceWith(document.createRange().createContextualFragment(hero(4)));else{let title=target.querySelector('.title');title?.insertAdjacentHTML('afterend',hero(version))}}document.querySelectorAll('.capture').forEach(c=>c.querySelector('h2')?.insertAdjacentHTML('beforebegin',wave()));let nav=document.querySelector('.appbar nav');nav?.insertAdjacentHTML('afterbegin',`<button class="motion-toggle" aria-pressed="${!motionOn}" onclick="toggleMotion()">${motionOn?'Pause motion':'Play motion'}</button>`)}document.body.classList.toggle('motion-paused',!motionOn);let canvas=document.querySelector('.sculpture');if(canvas){visualObserver=new IntersectionObserver(e=>{if(e[0].isIntersecting)startSculpture();else cancelAnimationFrame(visualRAF)});visualObserver.observe(canvas)}}
function startSculpture(){cancelAnimationFrame(visualRAF);let canvas=document.querySelector('.sculpture');if(!canvas)return;let ctx=canvas.getContext('2d');let r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.scale(dpr,dpr);let w=r.width,h=r.height;function draw(ms){if(!canvas.isConnected)return;let t=motionOn?ms*.00017:1.2;ctx.clearRect(0,0,w,h);let scale=Math.min(w*.25,h*.245),cx=w*.52,cy=h*.5;let dots=[];for(let j=0;j<34;j++){let a=j/34*Math.PI*2;for(let k=0;k<88;k++){let b=k/88*Math.PI*2;let R=1.04+.13*Math.sin(a*3+t*3);let rr=.36+.08*Math.sin(b*4+a*3+t*4);let x=(R+rr*Math.cos(b))*Math.cos(a), y=(R+rr*Math.cos(b))*Math.sin(a), z=rr*Math.sin(b);if(version===2){x*=.84;y*=1.1;z+=.18*Math.sin(a*3+t)}if(version===3){x*=1.22;y*=.7;z+=.15*Math.cos(a*5+t)}if(version===4){x*=.85;y*=1.15;z+=.12*Math.sin(a*6+t*2)}let c=Math.cos(t),ss=Math.sin(t);let xx=x*c+z*ss,zz=-x*ss+z*c;let tilt=.85;let yy=y*Math.cos(tilt)-zz*Math.sin(tilt), depth=y*Math.sin(tilt)+zz*Math.cos(tilt);let perspective=3.8/(3.8+depth);dots.push({x:cx+xx*scale*perspective,y:cy+yy*scale*perspective,z:depth,r:1.1+perspective*.9,col:j<12?'112,63,190':j<23?'232,107,65':'62,100,212'})}}dots.sort((a,b)=>b.z-a.z);for(let p of dots){ctx.fillStyle=`rgba(${p.col},${.38+(1.5-p.z)*.18})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}if(motionOn&&!document.hidden)visualRAF=requestAnimationFrame(draw)}draw(performance.now())}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(visualRAF);else if(motionOn)startSculpture()});window.addEventListener('resize',()=>startSculpture());

$('#capture').addEventListener('cancel',cleanup);$('#capture').addEventListener('close',cleanup);render();
</script></body></html>
